<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-openshorts.png" />
  <!-- viewport-fit=cover so the bottom tab bar can pad itself past the iOS home
       indicator with env(safe-area-inset-bottom); without it that inset reads 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="color-scheme" content="dark" />

  <!-- Fonts: Lumen system (Instrument Serif display · Geist body · JetBrains Mono labels).
       Served from this origin, not fonts.googleapis.com: a Google-hosted
       stylesheet sends every visitor's IP address to a US processor before the
       page has rendered and before anyone consented to anything. See
       public/fonts.css for how the subsets were generated. -->
  <link rel="stylesheet" href="/fonts.css" />  <!-- Primary SEO Meta Tags -->
  <title>GetShorts - Free Open Source AI Video Clipping Platform</title>
  <meta name="description" content="GetShorts: Turn long-form videos into viral 9:16 Shorts, Reels, and TikTok clips with smart reframing, auto subtitles, and AI UGC shorts." />
  <meta name="author" content="Zeishan Sheikh" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="GetShorts - Open Source AI Video Platform" />
  <meta property="og:description" content="Turn long videos into viral 9:16 shorts with smart reframing, auto Barlow subtitles, and AI UGC actors." />
  <meta property="og:site_name" content="GetShorts" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GetShorts - Open Source AI Video Platform" />
  <meta name="twitter:description" content="Free open-source AI video clip generator with smart reframing and auto subtitles." />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "GetShorts",
          "description": "Open source AI clip generator. Turns long-form videos into viral-ready 9:16 clips for TikTok, Instagram Reels and YouTube Shorts using Google Gemini for moment detection, faster-whisper for word-level subtitles and MediaPipe/YOLOv8 for face-tracked reframing.",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Cross-platform",
          "codeRepository": "https://github.com/zeishansheikh/GetShorts",
          "license": "https://opensource.org/licenses/MIT",
          "isAccessibleForFree": true,
          "author": {
            "@type": "Person",
            "name": "Zeishan Sheikh",
            "url": "https://github.com/zeishansheikh"
          }
        }
      ]
    }
  </script>

  <!-- Analytics — opt-in, disabled by default, and never loaded before consent.
       A plain `npm run build` (and every local `npm run dev`) leaves the two
       VITE_OPENPANEL_* variables unset, so nothing is initialised, no script is
       fetched and no request leaves the browser. Self-hosted instances are
       silent unless you deliberately turn this on.

       Nothing here RUNS on page load any more: it only publishes
       window.__osAnalyticsInit, and the React consent manager
       (src/lib/consent.js) calls it once the visitor has actually accepted the
       analytics category. Loading a tracker in the static <head> and asking
       afterwards is the exact pattern LSSI art. 22.2 forbids.

       op1.js is served from this origin (public/op1.js), not from
       openpanel.dev: a third-party script sees the visitor's IP and can be
       changed under us at any time.

       To collect analytics for your own deployment: point
       VITE_OPENPANEL_API_URL / VITE_OPENPANEL_CLIENT_ID at your own OpenPanel
       instance (see .env.example) and add your hostname to ANALYTICS_HOSTS. -->
    <script>
      window.op = window.op || function () { var n = []; return new Proxy(function () { arguments.length && n.push([].slice.call(arguments)); }, { get: function (t, r) { return "q" === r ? n : function () { n.push([r].concat([].slice.call(arguments))); }; }, has: function (t, r) { return "q" === r; } }); }();
      window.__osAnalyticsInit = (function () {
        var started = false;
        return function () {
          if (started) return false;
          // Vite substitutes these at build time and leaves the placeholder literal
          // in place when the variable is undefined.
          var apiUrl = "%VITE_OPENPANEL_API_URL%";
          var clientId = "%VITE_OPENPANEL_CLIENT_ID%";
          var unset = function (v) { return !v || v.charAt(0) === "%"; };
          if (unset(apiUrl) || unset(clientId)) return false;

          // Second gate: hosts allowed to report. A dist/ built with credentials
          // stays inert anywhere else (a fork, a mirror, a preview domain), so a
          // deployment can never report into somebody else's dashboard.
          var ANALYTICS_HOSTS = /^(www\.)?openshorts\.app$/;
          if (!ANALYTICS_HOSTS.test(location.hostname)) return false;

          started = true;
          window.op("init", {
            apiUrl: apiUrl,
            clientId: clientId,
            trackScreenViews: true,
            trackOutgoingLinks: true,
            trackAttributes: true,
          });

          var s = document.createElement("script");
          s.src = "/op1.js";
          s.defer = true;
          s.async = true;
          document.head.appendChild(s);
          return true;
        };
      })();
    </script>
  </head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
